name: Build Tailwind CSS

# Compiles the Tailwind v4 source (styles.css) into assets/css/site.css and
# commits the result back to the branch, so GitHub Pages (Deploy from a branch,
# / (root)) always serves the latest compiled stylesheet.
# NOTE: styles.css itself has NO runtime CSS in the pages — they load
# assets/css/site.css.

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'styles.css'
      - '**/*.html'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-tailwind
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build

      - name: Commit compiled CSS (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/css/site.css
          if git diff --cached --quiet; then
            echo "No changes to assets/css/site.css — nothing to commit."
          else
            git commit -m "build: compile Tailwind CSS (assets/css/site.css)"
            git push
          fi